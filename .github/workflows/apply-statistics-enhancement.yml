name: Apply statistics enhancement

on:
  push:
    branches:
      - main
    paths:
      - .github/triggers/statistics-enhancement.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply statistics changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/src/App.jsx')
          app = app_path.read_text(encoding='utf-8')

          old = '''  const sessionStats = useMemo(() => {
    const unique = new Set(state.sessions.flatMap((s) => s.participantIds));
    const participationCount = {};
    state.sessions.forEach((session) => {
      session.participantIds.forEach((id) => {
        participationCount[id] = (participationCount[id] || 0) + 1;
      });
    });
    return {
      nombreInscrits: unique.size,
      nombreCotisations: state.participants.filter((p) => p.cotisation).length,
      nombreFFME: state.participants.filter((p) => p.ffme).length,
      nombreRealisations: state.realisations.length,
      nombreVoiesActives: state.routes.filter((r) => r.active).length,
      participationCount,
      sortedParticipants: [...state.participants].sort((a, b) => fullName(a).localeCompare(fullName(b), "fr")),
    };
  }, [state]);'''

          new = '''  const sessionStats = useMemo(() => {
    const unique = new Set(state.sessions.flatMap((s) => s.participantIds));
    const participationCount = {};
    state.sessions.forEach((session) => {
      session.participantIds.forEach((id) => {
        participationCount[id] = (participationCount[id] || 0) + 1;
      });
    });

    const passportCounts = state.participants.reduce((counts, participant) => {
      const passport = normalizePassport(participant.passport);
      counts[passport] = (counts[passport] || 0) + 1;
      return counts;
    }, {});
    const sessionsLibres = state.sessions.filter((session) => session.status === "libre");
    const sessionsEncadrees = state.sessions.filter((session) => session.status === "encadree");
    const participationsLibres = sessionsLibres.reduce(
      (total, session) => total + session.participantIds.length,
      0,
    );
    const participationsEncadrees = sessionsEncadrees.reduce(
      (total, session) => total + session.participantIds.length,
      0,
    );

    return {
      nombreInscrits: unique.size,
      nombreCotisations: state.participants.filter((p) => p.cotisation).length,
      nombreFFME: state.participants.filter((p) => p.ffme).length,
      nombreRealisations: state.realisations.length,
      nombreVoiesActives: state.routes.filter((r) => r.active).length,
      nombreSeancesLibres: sessionsLibres.length,
      nombreSeancesEncadrees: sessionsEncadrees.length,
      nombreParticipationsLibreEncadree: participationsLibres + participationsEncadrees,
      passportCounts,
      participationCount,
      sortedParticipants: [...state.participants].sort((a, b) => fullName(a).localeCompare(fullName(b), "fr")),
    };
  }, [state]);'''

          if old not in app:
              raise SystemExit('Bloc sessionStats attendu introuvable dans App.jsx')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          section_path = Path('frontend/src/sections/StatisticsSection.jsx')
          section = section_path.read_text(encoding='utf-8')

          anchor = '''      <div className="stats-grid">
        <div className="stat"><div className="label">Inscrits uniques</div><div className="value">{sessionStats.nombreInscrits}</div></div>
        <div className="stat"><div className="label">Cotisations</div><div className="value">{sessionStats.nombreCotisations}</div></div>
        <div className="stat"><div className="label">FFME</div><div className="value">{sessionStats.nombreFFME}</div></div>
        <div className="stat"><div className="label">Voies actives</div><div className="value">{sessionStats.nombreVoiesActives}</div></div>
      </div>
'''

          replacement = '''      <div className="stats-grid">
        <div className="stat"><div className="label">Inscrits uniques</div><div className="value">{sessionStats.nombreInscrits}</div></div>
        <div className="stat"><div className="label">Cotisations</div><div className="value">{sessionStats.nombreCotisations}</div></div>
        <div className="stat"><div className="label">FFME</div><div className="value">{sessionStats.nombreFFME}</div></div>
        <div className="stat"><div className="label">Voies actives</div><div className="value">{sessionStats.nombreVoiesActives}</div></div>
      </div>

      <div className="stats-grid" style={{ marginTop: 12 }}>
        <div className="stat"><div className="label">Séances libres</div><div className="value">{sessionStats.nombreSeancesLibres}</div></div>
        <div className="stat"><div className="label">Séances encadrées</div><div className="value">{sessionStats.nombreSeancesEncadrees}</div></div>
        <div className="stat"><div className="label">Participations libre + encadrée</div><div className="value">{sessionStats.nombreParticipationsLibreEncadree}</div></div>
      </div>

      <div className="card">
        <div className="card-header">
          <h2>Grimpeurs par passeport</h2>
          <span className="badge">{sortedStatsParticipants.length} grimpeur{sortedStatsParticipants.length > 1 ? "s" : ""}</span>
        </div>
        <div className="stats-grid">
          {[
            ["sans", "Sans passeport"],
            ["blanc", "Blanc"],
            ["jaune", "Jaune"],
            ["orange", "Orange"],
            ["vert", "Vert"],
            ["bleu", "Bleu"],
            ["ocre", "Ocre"],
          ].map(([passport, label]) => (
            <div className="stat" key={passport}>
              <div className="label" style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span className="passport-dot" style={getPassportDotStyle({ passport })} aria-hidden="true" />
                {label}
              </div>
              <div className="value">{sessionStats.passportCounts?.[passport] || 0}</div>
            </div>
          ))}
        </div>
      </div>
'''

          if anchor not in section:
              raise SystemExit('Bloc de synthèse attendu introuvable dans StatisticsSection.jsx')
          section_path.write_text(section.replace(anchor, replacement, 1), encoding='utf-8')

          version_path = Path('frontend/src/lib/version.js')
          version = version_path.read_text(encoding='utf-8')
          old_version = '20260823.034'
          new_version = '20260823.035'
          if old_version not in version:
              raise SystemExit(f'Version attendue {old_version} introuvable')
          version_path.write_text(version.replace(old_version, new_version, 1), encoding='utf-8')
          PY

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Commit changes and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-statistics-enhancement.yml
          git rm .github/triggers/statistics-enhancement.trigger
          git add frontend/src/App.jsx frontend/src/sections/StatisticsSection.jsx frontend/src/lib/version.js
          git commit -m "feat: enrichir les statistiques séances et passeports"
          git push origin HEAD:main
