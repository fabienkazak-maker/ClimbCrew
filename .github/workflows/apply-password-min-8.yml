name: Apply password minimum 8

on:
  push:
    branches:
      - agent/password-min-8-260820014

permissions:
  contents: write

jobs:
  patch-password-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Appliquer la règle de 8 caractères
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('frontend/src/App.jsx'): [
                  ('Minimum 12 caractères', 'Minimum 8 caractères'),
                  ('value.length >= 12', 'value.length >= 8'),
              ],
              Path('backend/server.js'): [
                  ('value.length >= 12', 'value.length >= 8'),
              ],
              Path('backend/admin-users/security.js'): [
                  ('value.length >= 12', 'value.length >= 8'),
              ],
              Path('frontend/src/lib/version.js'): [
                  ('260820.013', '260820.014'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Motif absent dans {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          test_path = Path('backend/test/password-policy.test.js')
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("la politique de mot de passe utilise un minimum de 8 caractères partout", async () => {\n  const [frontend, server, security, version] = await Promise.all([\n    readFile(new URL("../../frontend/src/App.jsx", import.meta.url), "utf8"),\n    readFile(new URL("../server.js", import.meta.url), "utf8"),\n    readFile(new URL("../admin-users/security.js", import.meta.url), "utf8"),\n    readFile(new URL("../../frontend/src/lib/version.js", import.meta.url), "utf8"),\n  ]);\n\n  assert.match(frontend, /Minimum 8 caractères/);\n  assert.match(frontend, /value\\.length >= 8/);\n  assert.match(server, /value\\.length >= 8/);\n  assert.match(security, /value\\.length >= 8/);\n  assert.doesNotMatch(frontend, /value\\.length >= 12/);\n  assert.doesNotMatch(server, /value\\.length >= 12/);\n  assert.doesNotMatch(security, /value\\.length >= 12/);\n  assert.match(version, /260820\\.014/);\n});\n''', encoding='utf-8')
          PY

      - name: Vérifier les changements
        shell: bash
        run: |
          grep -F 'Minimum 8 caractères' frontend/src/App.jsx
          grep -F 'value.length >= 8' frontend/src/App.jsx backend/server.js backend/admin-users/security.js
          ! grep -R -F 'value.length >= 12' frontend/src/App.jsx backend/server.js backend/admin-users/security.js
          grep -F '260820.014' frontend/src/lib/version.js

      - name: Commit et push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.jsx backend/server.js backend/admin-users/security.js frontend/src/lib/version.js backend/test/password-policy.test.js
          git commit -m 'fix: autoriser les mots de passe dès 8 caractères'
          git push origin HEAD:agent/password-min-8-260820014
