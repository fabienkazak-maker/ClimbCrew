name: Apply password rule text

on:
  push:
    branches:
      - agent/password-rule-text-260820016

permissions:
  contents: write

jobs:
  patch-password-rule-text:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aligner le texte de la règle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.jsx')
          text = app.read_text(encoding='utf-8')
          old = 'Minimum 8 caractères avec majuscule, minuscule, chiffre et caractère spécial.'
          new = '8 caractères minimum, dont 1 majuscule, 1 minuscule, 1 chiffre et 1 caractère spécial.'
          if old not in text:
              raise SystemExit('Ancien libellé de règle absent dans App.jsx')
          app.write_text(text.replace(old, new), encoding='utf-8')

          server = Path('backend/server.js')
          text = server.read_text(encoding='utf-8')
          old_error = 'Mot de passe insuffisamment robuste'
          new_error = 'Le mot de passe doit contenir 8 caractères minimum, dont 1 majuscule, 1 minuscule, 1 chiffre et 1 caractère spécial'
          if old_error not in text:
              raise SystemExit('Message serveur de mot de passe absent')
          server.write_text(text.replace(old_error, new_error), encoding='utf-8')

          version = Path('frontend/src/lib/version.js')
          text = version.read_text(encoding='utf-8')
          if '260820.015' not in text:
              raise SystemExit('Version 260820.015 absente')
          version.write_text(text.replace('260820.015', '260820.016'), encoding='utf-8')

          test = Path('backend/test/password-policy.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace('assert.match(frontend, /Minimum 8 caractères/);', 'assert.match(frontend, /8 caractères minimum/);')
          marker = '  assert.match(server, /value\\.length >= 8/);\n'
          addition = marker + '  assert.match(server, /8 caractères minimum/);\n'
          if marker not in text:
              raise SystemExit('Point insertion test absent')
          test.write_text(text.replace(marker, addition), encoding='utf-8')
          PY

      - name: Vérifier les changements
        shell: bash
        run: |
          grep -F '8 caractères minimum, dont 1 majuscule, 1 minuscule, 1 chiffre et 1 caractère spécial.' frontend/src/App.jsx
          grep -F 'Le mot de passe doit contenir 8 caractères minimum' backend/server.js
          grep -F '260820.016' frontend/src/lib/version.js

      - name: Commit et push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.jsx backend/server.js backend/test/password-policy.test.js frontend/src/lib/version.js
          git commit -m 'fix: aligner le texte de la règle mot de passe sur 8 caractères'
          git push origin HEAD:agent/password-rule-text-260820016
