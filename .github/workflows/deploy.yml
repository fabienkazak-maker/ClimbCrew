name: Validate and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: climbcrew-validation-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation du code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Tester le frontend
        working-directory: frontend
        run: npm test

      - name: Construire le frontend
        working-directory: frontend
        run: npm run build

      # Le backend ne possède pas encore de package-lock.json.
      # npm install reste donc nécessaire jusqu'à sa génération contrôlée.
      - name: Installer le backend
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Vérifier la syntaxe du backend
        working-directory: backend
        run: node --check server.js

      - name: Tester le backend
        working-directory: backend
        run: npm test

  deploy:
    name: Déployer sur le serveur de production
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Vérifier le fichier d'environnement de production
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "/opt/climbcrew/.env.production" ]; then
            echo "ERROR: /opt/climbcrew/.env.production not found."
            echo "Please create it manually before deploying."
            exit 1
          fi

          echo ".env.production found"

      - name: Synchroniser les identifiants SMTP dans .env.production
        shell: bash
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
            echo "SMTP_USER/SMTP_PASSWORD secrets not set, leaving .env.production untouched."
            exit 0
          fi

          ENV_FILE="/opt/climbcrew/.env.production"

          set_env_var() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" "$ENV_FILE"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              echo "${key}=${value}" >> "$ENV_FILE"
            fi
          }

          set_env_var "EMAIL_ENABLED" "true"
          set_env_var "SMTP_HOST" "smtp.gmail.com"
          set_env_var "SMTP_PORT" "587"
          set_env_var "SMTP_SECURE" "false"
          set_env_var "SMTP_REQUIRE_TLS" "true"
          set_env_var "SMTP_USER" "${SMTP_USER}"
          set_env_var "SMTP_PASSWORD" "${SMTP_PASSWORD}"
          set_env_var "EMAIL_FROM_NAME" "ClimbClubCristal"
          set_env_var "EMAIL_FROM_ADDRESS" "${SMTP_USER}"
          echo "SMTP credentials synced into .env.production"

      - name: Déployer en production
        shell: bash
        run: |
          set -euo pipefail

          cd /opt/climbcrew

          DEPLOY_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"

          echo "=== Synchronizing latest validated code from ${DEPLOY_BRANCH} ==="
          git fetch origin "${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"

          echo "=== Building and starting containers ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

          echo "=== Checking backend health ==="
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              echo "Backend healthy"
              echo "=== Deployment completed ==="
              exit 0
            fi
            sleep 5
          done

          echo "ERROR: backend health check failed"
          docker logs --tail 200 climbcrew-backend || true
          exit 1
