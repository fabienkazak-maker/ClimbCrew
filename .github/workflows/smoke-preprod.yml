name: Smoke test préproduction

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  workflow_run:
    workflows: ["Validate and Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: smoke-preprod
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Vérifier la présence des secrets du compte de test
        env:
          TEST_EMAIL: ${{ secrets.CLIMBCREW_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.CLIMBCREW_TEST_PASSWORD }}
        shell: bash
        run: |
          test -n "$TEST_EMAIL" && test -n "$TEST_PASSWORD" || {
            echo "::error::Configurer CLIMBCREW_TEST_EMAIL et CLIMBCREW_TEST_PASSWORD dans les secrets Actions du dépôt."
            exit 1
          }

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Vérifier la connexion réelle sur la PPD
        working-directory: frontend
        env:
          CLIMBCREW_TEST_EMAIL: ${{ secrets.CLIMBCREW_TEST_EMAIL }}
          CLIMBCREW_TEST_PASSWORD: ${{ secrets.CLIMBCREW_TEST_PASSWORD }}
        run: npx playwright test --config=playwright.preprod.config.mjs
