name: Refactor server legacy phase 1

on:
  push:
    branches:
      - refactor/server-legacy-phase1-20260823
    paths:
      - backend/tools/refactor-server-legacy.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/server-legacy-phase1-20260823
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: node backend/tools/refactor-server-legacy.mjs
      - name: Validate generated source
        run: |
          node --check backend/server.js
          git diff --check
      - name: Commit generated server.js
        run: |
          if git diff --quiet -- backend/server.js; then
            echo "No generated change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git commit -m "Retirer les handlers legacy déjà remplacés"
          git push origin HEAD:refactor/server-legacy-phase1-20260823
