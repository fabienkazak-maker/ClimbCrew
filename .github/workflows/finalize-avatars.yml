name: Finaliser les avatars

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-avatars.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Produire et contrôler les variantes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Produire les séries homme et femme
        run: bash scripts/finalize-avatar-variants.sh

      - name: Résumer la production
        run: |
          echo "Fichiers homme/femme générés :"
          find frontend/public/media/avatars/evolutions -type f \( -path '*/homme/level-*.webp' -o -path '*/femme/level-*.webp' \) | wc -l
          echo "Fichiers vides :"
          find frontend/public/media/avatars/evolutions -type f -size 0 -print

      - name: Committer la production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/media/avatars/evolutions
          if git diff --cached --quiet; then
            echo 'Aucun changement à committer.'
            exit 0
          fi
          git commit -m 'feat(avatars): complete male and female evolution series'
          git push origin HEAD:main
