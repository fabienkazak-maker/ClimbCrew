name: Finaliser les avatars

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    name: Produire et contrôler les variantes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer les outils graphiques
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Produire les 16 évolutions du sac à magnésie
        run: python3 scripts/generate-sac-magnesie-series.py

      - name: Produire et contrôler les autres séries homme et femme
        run: bash scripts/finalize-avatar-variants.sh

      - name: Détecter une production réellement modifiée
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- frontend/public/media/avatars/evolutions frontend/src/components/ProfileGecko.jsx)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Des variantes ont changé."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement d'avatar à publier."
          fi

      - name: Calculer la prochaine version ClimbCrew
        if: steps.changes.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/.*configuredVersion || "\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' frontend/src/lib/version.js | head -n 1)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]{8}\.[0-9]{3}$ ]]; then
            echo "ERROR: version ClimbCrew courante introuvable : $CURRENT_VERSION"
            exit 1
          fi

          TODAY="$(TZ=Europe/Paris date +%Y%m%d)"
          CURRENT_DAY="${CURRENT_VERSION%%.*}"
          CURRENT_SEQUENCE="${CURRENT_VERSION##*.}"
          if [ "$CURRENT_DAY" = "$TODAY" ]; then
            NEXT_SEQUENCE=$((10#$CURRENT_SEQUENCE + 1))
          else
            NEXT_SEQUENCE=1
          fi
          NEXT_VERSION="${TODAY}.$(printf '%03d' "$NEXT_SEQUENCE")"
          ASSET_VERSION="${NEXT_VERSION//./}"

          printf 'version=%s\n' "$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          printf 'asset_version=%s\n' "$ASSET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version avatars : $CURRENT_VERSION -> $NEXT_VERSION"

      - name: Mettre à jour les versions application et assets
        if: steps.changes.outputs.changed == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          ASSET_VERSION: ${{ steps.version.outputs.asset_version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          next_version = os.environ["NEXT_VERSION"]
          asset_version = os.environ["ASSET_VERSION"]

          version_file = Path("frontend/src/lib/version.js")
          version_text = version_file.read_text(encoding="utf-8")
          next_text, count = re.subn(
              r'(export const APP_VERSION = configuredVersion \|\| ")[0-9]{8}\.[0-9]{3}(";)',
              rf'\g<1>{next_version}\2',
              version_text,
          )
          if count != 1:
              raise SystemExit("Impossible de mettre à jour APP_VERSION")
          version_file.write_text(next_text, encoding="utf-8")

          profile_file = Path("frontend/src/components/ProfileGecko.jsx")
          profile_text = profile_file.read_text(encoding="utf-8")
          next_profile, count = re.subn(
              r'const ASSET_VERSION = "[^"]+";',
              f'const ASSET_VERSION = "{asset_version}";',
              profile_text,
          )
          if count != 1:
              raise SystemExit("Impossible de mettre à jour ASSET_VERSION")
          profile_file.write_text(next_profile, encoding="utf-8")
          PY

      - name: Résumer la production
        run: |
          echo "Fichiers homme/femme générés :"
          find frontend/public/media/avatars/evolutions -type f \( -path '*/homme/level-*.webp' -o -path '*/femme/level-*.webp' \) | wc -l
          echo "Sac à magnésie :"
          find frontend/public/media/avatars/evolutions/sac_magnesie -type f \( -path '*/homme/level-*.webp' -o -path '*/femme/level-*.webp' \) -print | sort
          echo "Fichiers vides :"
          find frontend/public/media/avatars/evolutions -type f -size 0 -print

      - name: Publier les changements sur une branche dédiée
        if: steps.changes.outputs.changed == 'true'
        id: publish
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="automation/finalize-avatars-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add frontend/public/media/avatars/evolutions frontend/src/components/ProfileGecko.jsx frontend/src/lib/version.js
          git commit -m "feat(avatars): publier les variantes v${NEXT_VERSION}"
          git push origin HEAD:"$BRANCH"
          printf 'branch=%s\n' "$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Ouvrir une Pull Request de validation
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Publier les avatars ${NEXT_VERSION}" \
            --body "Production automatisée des variantes d'avatars. Aucun push direct sur main : la publication passe par les validations normales de la Pull Request."
