name: Apply access password text

on:
  push:
    branches:
      - agent/fix-access-password-text-260820018

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corriger la règle affichée
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          access = Path('frontend/src/issue-13-access-page.js')
          text = access.read_text(encoding='utf-8')
          old = 'Au moins 12 caractères, avec au moins une lettre majuscule, une lettre minuscule, un chiffre et un caractère spécial.'
          new = '8 caractères minimum, dont 1 majuscule, 1 minuscule, 1 chiffre et 1 caractère spécial.'
          if old not in text:
              raise SystemExit('Ancienne règle 12 caractères absente')
          access.write_text(text.replace(old, new), encoding='utf-8')

          version = Path('frontend/src/lib/version.js')
          text = version.read_text(encoding='utf-8')
          if '260820.017' not in text:
              raise SystemExit('Version 260820.017 absente')
          version.write_text(text.replace('260820.017', '260820.018'), encoding='utf-8')

          test = Path('frontend/test/access-password-policy.test.js')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("la surcouche de création de compte affiche bien la règle à 8 caractères", async () => {\n  const source = await readFile(new URL("../src/issue-13-access-page.js", import.meta.url), "utf8");\n  assert.match(source, /8 caractères minimum/);\n  assert.doesNotMatch(source, /12 caractères/);\n});\n''', encoding='utf-8')
          PY

      - name: Commit et push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/issue-13-access-page.js frontend/src/lib/version.js frontend/test/access-password-policy.test.js
          git commit -m 'fix: corriger la règle mot de passe affichée sur la création de compte'
          git push origin HEAD:agent/fix-access-password-text-260820018
