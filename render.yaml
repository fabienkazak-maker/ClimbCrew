# =============================================================================
# Déploiement Render de ClimbCrew
# =============================================================================
# Ce Blueprint décrit les trois ressources Render :
# - l'API Node/Express ;
# - le frontend React/Vite servi comme site statique ;
# - la base PostgreSQL managée.
#
# Il ne remplace pas le déploiement Linux. Docker Compose continue d'utiliser
# docker-compose.prod.yml et .env.production. Les réglages propres à Render sont
# donc isolés dans ce fichier.

services:
  # ---------------------------------------------------------------------------
  # Backend : API, authentification, règles métier et accès PostgreSQL.
  # Impact visuel : aucune page n'est générée ici, mais une API indisponible se
  # traduit côté utilisateur par un écran vide ou par des données non chargées.
  # ---------------------------------------------------------------------------
  - type: web
    name: ClimbCrew-api
    runtime: node
    plan: free
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      # Mode production : active les protections renforcées du backend.
      - key: NODE_ENV
        value: production

      # Render fournit lui-même PORT. HOST documente explicitement que le
      # service doit accepter le trafic transmis par le proxy Render.
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"

      # Connexion privée à PostgreSQL. Aucun mot de passe n'est stocké dans Git.
      - key: DATABASE_URL
        fromDatabase:
          name: ClimbCrew-db
          property: connectionString
      - key: PG_SSL
        value: "false"

      # L'URL publique du frontend Render est injectée automatiquement.
      # Le module deployment-compatibility.js la fusionne avec le domaine Linux.
      - key: RENDER_FRONTEND_URL
        fromService:
          type: web
          name: ClimbCrew-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_URL
        value: https://climbcrew.dip-tcs.com

      # Deux services Render utilisent deux origines HTTP différentes.
      # Les cookies doivent donc être sécurisés et acceptés en contexte croisé.
      - key: SECURE_COOKIES
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CROSS_ORIGIN_CSRF_BRIDGE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: climbcrew_session
      - key: CSRF_COOKIE_NAME
        value: climbcrew_csrf
      - key: SESSION_DURATION_DAYS
        value: "7"

      # Secret de maintenance généré et conservé par Render.
      - key: SETUP_TOKEN
        generateValue: true

      # Ces deux valeurs sont demandées dans l'interface Render lors de la
      # première création. Elles ne sont jamais enregistrées dans le dépôt.
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false

      # Paramètres de sécurité et limites de charge.
      - key: ALLOW_WEAK_FIRST_ADMIN_PASSWORD
        value: "false"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RESET_TOKEN_DURATION_MINUTES
        value: "60"
      - key: MAX_JSON_BODY_SIZE
        value: 10mb
      - key: WRITE_RATE_LIMIT_PER_MINUTE
        value: "120"

  # ---------------------------------------------------------------------------
  # Frontend : interface React visible par les grimpeurs et administrateurs.
  # La variable API est construite pendant le build à partir du nom réellement
  # attribué par Render, ce qui évite de coder une URL avec un suffixe aléatoire.
  # ---------------------------------------------------------------------------
  - type: web
    name: ClimbCrew-frontend
    runtime: static
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm ci --no-audit --no-fund && VITE_API_URL="https://${CLIMBCREW_API_HOST}/api" npm run build
    staticPublishPath: dist
    envVars:
      - key: CLIMBCREW_API_HOST
        fromService:
          type: web
          name: ClimbCrew-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: VITE_CSRF_COOKIE_NAME
        value: climbcrew_csrf

    # Les routes inconnues servent index.html afin que la navigation React ne
    # retourne pas une erreur 404 lors d'un rafraîchissement de page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # En-têtes sans impact sur la mise en page. Ils protègent le site contre
    # l'intégration dans une iframe et certains détournements de contenu.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# -----------------------------------------------------------------------------
# PostgreSQL : stockage durable des comptes, séances, inscriptions et voies.
# L'API utilise la connexion interne Render, plus rapide et non exposée au web.
#
# Le nom logique de la base et l'utilisateur ne sont pas imposés ici : Render
# conserve ainsi les paramètres d'une base ClimbCrew-db déjà existante. Pour une
# nouvelle base, Render génère automatiquement des valeurs compatibles et les
# transmet à l'API grâce à DATABASE_URL.
# -----------------------------------------------------------------------------
databases:
  - name: ClimbCrew-db
    plan: free
